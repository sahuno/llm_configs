  - id: d
    site: 83
    origin: .na.character
    origin_kind: file
    transform:
      op: read
      fn: fread
  - id: all_cpg
    site: 90
    derived_from: ~
    transform:
      op: rbind
  - id: all_cpg
    site: 92
    derived_from:
      - all_cpg
    transform:
      op: merge
      by:
        - sample
  - id: d
    site: 101
    derived_from:
      - all_cpg
    transform:
      op: subset
      expr: all_cpg[gene == g]
  - id: X_mat
    site: 106
    derived_from: ~
    transform:
      op: typecast
      fn: as.matrix
  - id: X_mat
    site: 107
    derived_from:
      - X_mat
    transform:
      op: subset
      expr: X_mat[, colMeans(!is.na(X_mat)) >= opt$min_cov_frac, drop = FALSE]
  - id: X_mat
    site: 113
    derived_from:
      - X_mat
    transform:
      op: subset
      expr: X_mat[, keep, drop = FALSE]
  - id: tpm_rows
    site: 116
    derived_from:
      - tpm
    transform:
      op: subset
      expr: tpm[gene_symbol == g]
  - id: X_mat
    site: 125
    derived_from:
      - X_mat
    transform:
      op: subset
      expr: X_mat[tpm_cols, , drop = FALSE]
  - id: dt
    site: 176
    derived_from: ~
    transform:
      op: rbind
  - id: agg
    site: 182
    derived_from:
      - dt
    transform:
      op: subset
      expr: dt[, .(n = first(n), p = first(p), q2_mean = mean(q2, na.rm = TRUE), q2_sd
        = sd(q2, na.rm = TRUE), q2_min = min(q2, na.rm = TRUE), q2_max = max(q2, na.rm
        = TRUE), positive_q2_seeds = sum(q2 > 0, na.r...
  - id: best_per_gene
    site: 193
    derived_from:
      - agg
    transform:
      op: subset
      expr: agg[, .SD[which.max(q2_mean)], by = gene]
  - id: gene_order_dt
    site: 209
    derived_from:
      - dt
    transform:
      op: subset
      expr: dt[, .(q2_avg = mean(q2, na.rm = TRUE)), by = gene]
