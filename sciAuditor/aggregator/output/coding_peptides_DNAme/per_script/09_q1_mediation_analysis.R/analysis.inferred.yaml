package_resources: ~
env_vars_read: []
env_vars_written: []
dataframes:
  - id: meth_wide
    site: 142
    origin: '{opt.methylation_wide}'
    origin_kind: file
    transform:
      op: read
      fn: fread
  - id: cand_meth
    site: 145
    derived_from:
      - meth_wide
    transform:
      op: subset
      expr: meth_wide[gene_symbol_meth %in% candidate_genes$gene_symbol]
  - id: pep_dt
    site: 156
    origin: '{opt.peptide_counts}'
    origin_kind: file
    transform:
      op: read
      fn: fread
  - id: tpm_dt
    site: 168
    origin: '{opt.tpm}'
    origin_kind: file
    transform:
      op: read
      fn: fread
  - id: combined
    site: 179
    derived_from: ~
    transform:
      op: merge
      by:
        - patient_id
        - gene_symbol
  - id: combined
    site: 184
    derived_from:
      - combined
    transform:
      op: merge
      by:
        - patient_id
        - gene_symbol
  - id: combined
    site: 190
    derived_from:
      - combined
    transform:
      op: merge
      by:
        - gene_symbol
  - id: per_gene_n
    site: 196
    derived_from:
      - combined
    transform:
      op: subset
      expr: combined[!is.na(pct_5mC) & !is.na(tpm), .(n_complete = .N, var_meth =
        var(pct_5mC, na.rm = TRUE), var_tpm = var(log2_tpm, na.rm = TRUE), n_with_peptide
        = sum(peptide_count > 0)), by = .(gene_symbol, ...
  - id: per_gene_n
    site: 202
    derived_from:
      - per_gene_n
    transform:
      op: subset
      expr: per_gene_n[order(-n_complete)]
  - id: eligible_genes
    site: 214
    derived_from:
      - per_gene_n
    transform:
      op: subset
      expr: per_gene_n[n_complete >= 5 & var_meth > 0 & var_tpm > 0, gene_symbol]
  - id: pergene_results
    site: 275
    derived_from:
      - eligible_genes
      - combined
    transform:
      op: rbind
  - id: d
    site: 276
    derived_from:
      - combined
    transform:
      op: subset
      expr: combined[gene_symbol == g]
  - id: pergene_results
    site: 282
    derived_from:
      - pergene_results
    transform:
      op: merge
      by:
        - gene_symbol
  - id: pergene_results
    site: 284
    derived_from:
      - pergene_results
    transform:
      op: subset
      expr: pergene_results[order(indirect_p)]
  - id: d
    site: 300
    derived_from:
      - d
    transform:
      op: subset
      expr: d[!is.na(pct_5mC) & !is.na(tpm)]
  - id: pooled_results
    site: 339
    derived_from:
      - d
      - combined
    transform:
      op: rbind
  - id: d
    site: 340
    derived_from:
      - combined
    transform:
      op: subset
      expr: combined[category == cat]
  - id: valid_results
    site: 355
    derived_from:
      - pergene_results
    transform:
      op: subset
      expr: pergene_results[is.na(error) & !is.na(indirect_effect)]
  - id: forest_dt
    site: 359
    derived_from:
      - valid_results
    transform:
      op: subset
      expr: valid_results[, .(gene_symbol, category, indirect_effect, indirect_ci_lower,
        indirect_ci_upper, indirect_p)]
  - id: forest_dt
    site: 362
    derived_from:
      - forest_dt
    transform:
      op: subset
      expr: forest_dt[order(category, indirect_effect)]
  - id: prop_dt
    site: 383
    derived_from:
      - valid_results
    transform:
      op: subset
      expr: valid_results[!is.na(proportion_mediated)]
  - id: prop_dt
    site: 384
    derived_from:
      - prop_dt
    transform:
      op: subset
      expr: prop_dt[order(category, -proportion_mediated)]
  - id: scatter_dt
    site: 407
    derived_from:
      - combined
    transform:
      op: subset
      expr: combined[gene_symbol %in% top_candidates & !is.na(pct_5mC) & !is.na(tpm)]
  - id: pooled_valid
    site: 490
    derived_from:
      - pooled_results
    transform:
      op: subset
      expr: pooled_results[is.na(error)]
transformations: []
models:
  - id: total_model
    site: 251
    fn: lm
    formula: peptide_count ~ pct_5mC
    count_data: d
    col_data: ~
    contrasts: []
