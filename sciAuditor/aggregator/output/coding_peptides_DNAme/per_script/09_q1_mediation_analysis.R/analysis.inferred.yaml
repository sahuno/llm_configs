      site: 25
    - name: --peptide_counts
      type: character
      default: /data1/greenbab/projects/janjigian_su2c_WGS-ONT_sam/DNAme_prod/results/coding_peptides_DNAme/gene_peptide_counts_annotated.tsv
      default_kind: absolute
      help: 'Path to gene_peptide_counts_annotated.tsv [default: %default]'
      site: 29
    - name: --tpm
      type: character
      default: /data1/greenbab/projects/janjigian_su2c_WGS-ONT_sam/DNAme_prod/scripts/coding_peptides_DNAme/tpm_all_samples.tsv
