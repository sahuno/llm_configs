      site: 273
    write_mode: overwrite
    write_params:
      sep: "\t"
    resolution_confidence: medium
package_resources: ~
env_vars_read: []
env_vars_written: []
dataframes:
  - id: merged
    site: 75
    origin: '{opt.q9_merged}'
    origin_kind: file
    transform:
      op: read
      fn: fread
  - id: q2q3_res
    site: 142
    derived_from: ~
    transform:
      op: rbind
  - id: pg
    site: 148
    origin: '{opt.q1_pergene}'
    origin_kind: file
    transform:
      op: read
      fn: fread
  - id: pg
    site: 149
    derived_from:
      - pg
      - merged
    transform:
      op: merge
      by:
        - patient_id
  - id: sub
    site: 154
    derived_from:
      - pg
    transform:
      op: subset
      expr: pg[gene_symbol_meth == g & !is.na(pct_5mC) & !is.na(log2_tpm)]
  - id: sub_adj
    site: 164
    derived_from:
      - sub
    transform:
      op: subset
      expr: sub[!is.na(purity_composite)]
  - id: path_a_res
    site: 185
    derived_from: ~
    transform:
      op: rbind
  - id: tw
    site: 192
    origin: '{opt.q1_3way}'
    origin_kind: file
    transform:
      op: read
      fn: fread
  - id: tw
    site: 194
    derived_from:
      - tw
      - merged
    transform:
      op: merge
      by:
        - patient_id
  - id: sub
    site: 198
    derived_from:
      - tw
    transform:
      op: subset
      expr: tw[gene_symbol_meth == g & !is.na(pct_5mC) & !is.na(peptide_count)]
  - id: sub_adj
    site: 206
    derived_from:
      - sub
    transform:
      op: subset
      expr: sub[!is.na(purity_composite)]
  - id: total_res
    site: 222
    derived_from: ~
    transform:
      op: rbind
  - id: sub
    site: 236
    derived_from:
      - merged
    transform:
      op: subset
      expr: merged[!is.na(get(pred)) & !is.na(get(tcol)) & !is.na(get(ecol)) & get(tcol)
        > 0]
  - id: sub_adj
    site: 247
    derived_from:
      - sub
    transform:
      op: subset
      expr: sub[!is.na(purity_composite)]
  - id: cox_sens
    site: 272
    derived_from: ~
    transform:
      op: rbind
  - id: fdf
    site: 294
    derived_from:
      - cox_sens
    transform:
      op: subset
      expr: cox_sens[, .(predictor, outcome, HR_raw, HR_adj, ci_low_raw, ci_high_raw,
        ci_low_adj, ci_high_adj)]
  - id: long
    site: 295
    derived_from:
      - fdf
    transform:
      op: rbind
  - id: long
    site: 300
    derived_from:
      - long
    transform:
      op: subset
      expr: long[!is.na(HR) & is.finite(HR)]
  - id: pad
    site: 315
    derived_from:
      - path_a_res
    transform:
      op: subset
      expr: path_a_res[!is.na(slope_adj)]
