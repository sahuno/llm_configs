schema_version: '0.2'
analysis_unit:
  id: 12_purity_sensitivity
  kind: pair
pair_unit:
  launcher:
    path: /data1/greenbab/projects/janjigian_su2c_WGS-ONT_sam/DNAme_prod/scripts/coding_peptides_DNAme/scripts/submit_12_purity_sensitivity.sh
    language: bash
  analysis:
    path: /data1/greenbab/projects/janjigian_su2c_WGS-ONT_sam/DNAme_prod/scripts/coding_peptides_DNAme/scripts/12_purity_sensitivity.R
    language: R
  binding:
    - launcher_var: RESULTS_DIR
      analysis_flag: --outdir
      value_resolved: /data1/greenbab/projects/janjigian_su2c_WGS-ONT_sam/DNAme_prod/results/coding_peptides_DNAme
      site: launcher:15 → analysis:31
    - launcher_var: LOG_DIR
      analysis_flag: --log_dir
      value_resolved: /data1/greenbab/projects/janjigian_su2c_WGS-ONT_sam/DNAme_prod/scripts/coding_peptides_DNAme/logs
      site: launcher:16 → analysis:34
  effective_cwd_at_analysis: ~
script:
  path: /data1/greenbab/projects/janjigian_su2c_WGS-ONT_sam/DNAme_prod/scripts/coding_peptides_DNAme/scripts/12_purity_sensitivity.R
  language: R
  git_rev: <runtime>
  inferred_at: 2026-05-15T00:16:10-0400
  layers_used:
    - static
runtime_context:
  cwd_at_invocation: <runtime>
  resolved_cwd: <runtime>
  host: <runtime>
  user: <runtime>
config_interface:
  framework: optparse
  options:
    - name: --q9_merged
      type: character
      default: /data1/greenbab/projects/janjigian_su2c_WGS-ONT_sam/DNAme_prod/results/coding_peptides_DNAme/Q9_merged_predictors_clinical.tsv
      default_kind: absolute
      help: Q9 merged per-patient table with clinical + predictors + purity
      site: 19
    - name: --q1_pergene
      type: character
      default: /data1/greenbab/projects/janjigian_su2c_WGS-ONT_sam/DNAme_prod/results/coding_peptides_DNAme/Q2exp_apm_meth_tpm_persample.tsv
      default_kind: absolute
      help: Per-gene APM methylation + TPM for Q1 path A (n=36 tumors)
      site: 23
    - name: --q1_3way
      type: character
      default: /data1/greenbab/projects/janjigian_su2c_WGS-ONT_sam/DNAme_prod/results/coding_peptides_DNAme/Q2_apm_3way_meth_tpm_peptide.tsv
      default_kind: absolute
      help: Per-gene methylation × TPM × peptide for Q1 mediation (n=9 tumors)
      site: 27
    - name: --outdir
      type: character
      default: /data1/greenbab/projects/janjigian_su2c_WGS-ONT_sam/DNAme_prod/results/coding_peptides_DNAme
      default_kind: absolute
      help: ~
      site: 31
    - name: --log_dir
      type: character
      default: logs
      default_kind: relative
      help: ~
      site: 34
inputs:
  - id: input_01
    path_template: '{opt.q9_merged}'
    kind: tabular
    format: tsv
    read_call:
      fn: fread
      site: 75
    read_params:
      header: ~
      col.names: ~
      skip: ~
    header_dropped: no
    resolution_confidence: high
  - id: input_02
    path_template: '{opt.q1_pergene}'
    kind: tabular
    format: tsv
    read_call:
      fn: fread
      site: 148
    read_params:
      header: ~
      col.names: ~
      skip: ~
    header_dropped: no
    resolution_confidence: high
  - id: input_03
    path_template: '{opt.q1_3way}'
    kind: tabular
    format: tsv
    read_call:
      fn: fread
      site: 192
    read_params:
      header: ~
      col.names: ~
      skip: ~
    header_dropped: no
    resolution_confidence: high
outputs:
  - id: output_01
    kind: tabular
    format: tsv
    path_template: '{OUTDIR}/Q12_purity_adjusted_spearman.tsv'
    write_call:
      fn: fwrite
      site: 143
    write_mode: overwrite
    write_params:
      sep: "\t"
    resolution_confidence: medium
  - id: output_02
    kind: tabular
    format: tsv
