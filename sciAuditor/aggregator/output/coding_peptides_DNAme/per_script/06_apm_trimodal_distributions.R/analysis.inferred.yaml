    transform:
      op: subset
      expr: apm_meth_long[patient_id %in% overlap_all3 & !is.na(pct_5mC), .(gene_symbol,
        patient_id, category, modality = "Methylation (% 5mC)", value = pct_5mC)]
  - id: tpm_sub
    site: 407
    derived_from:
