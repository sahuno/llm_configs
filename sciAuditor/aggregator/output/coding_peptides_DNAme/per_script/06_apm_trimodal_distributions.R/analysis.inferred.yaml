    transform:
      op: subset
      expr: apm_meth_long[!is.na(pct_5mC), .(meth_n_samples = .N, meth_mean = round(mean(pct_5mC),
        1), meth_median = round(median(pct_5mC), 1), meth_sd = round(sd(pct_5mC),
        1), meth_min = round(min(pct_5mC), 1),...
  - id: tpm_summary
    site: 535
    derived_from:
      - apm_tpm_long
    transform:
      op: subset
      expr: apm_tpm_long[!is.na(tpm), .(tpm_n_samples = .N, tpm_mean = round(mean(tpm),
        1), tpm_median = round(median(tpm), 1), tpm_sd = round(sd(tpm), 1), tpm_min
        = round(min(tpm), 1), tpm_max = round(max(tpm),...
  - id: pep_summary
    site: 544
    derived_from:
      - apm_pep_long
    transform:
      op: subset
      expr: apm_pep_long[!is.na(peptide_count), .(pep_n_samples = .N, pep_total =
        sum(peptide_count), pep_mean = round(mean(peptide_count), 1), pep_median =
        round(median(peptide_count), 1), pep_max = max(peptide...
  - id: gene_summary
    site: 553
    derived_from:
      - meth_summary
      - tpm_summary
      - pep_summary
    transform:
      op: merge
      by:
        - gene_symbol
  - id: gene_summary
    site: 555
    derived_from:
      - gene_summary
    transform:
      op: merge
      by:
        - gene_symbol
  - id: gene_summary
    site: 556
    derived_from:
      - gene_summary
    transform:
      op: subset
      expr: gene_summary[order(category, gene_symbol)]
