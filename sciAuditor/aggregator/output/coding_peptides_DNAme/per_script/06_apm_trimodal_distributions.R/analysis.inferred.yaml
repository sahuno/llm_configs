        patient_id, category, modality = "Expression (log2 TPM+1)", value = log2(tpm
        + 1))]
  - id: pep_sub
    site: 410
    derived_from:
      - apm_pep_long
    transform:
      op: subset
      expr: apm_pep_long[patient_id %in% overlap_all3 & !is.na(peptide_count), .(gene_symbol,
        patient_id, category, modality = "Peptide count", value = as.double(peptide_count))]
  - id: combined
    site: 413
    derived_from:
