dataframes:
  - id: obs
    site: 58
    origin: '{opt.obs}'
    origin_kind: file
    transform:
      op: read
      fn: fread
  - id: obs
    site: 59
    derived_from:
      - obs
    transform:
      op: subset
      expr: obs[!is.na(q2_loocv) & alpha_name %in% c("ridge", "elastic_net", "lasso"),
        .(gene, alpha_name, alpha, q2_loocv, pearson_r_loocv, spearman_r_loocv, n,
        p, perm_seed = 0L)]
  - id: d
    site: 73
    origin: '{fp}'
    origin_kind: file
    transform:
      op: read
      fn: fread
  - id: d
    site: 74
    derived_from:
      - d
    transform:
      op: subset
      expr: d[!is.na(q2_loocv) & alpha_name %in% c("ridge", "elastic_net", "lasso"),
        .(gene, alpha_name, q2_loocv, pearson_r_loocv, n, p, perm_seed)]
  - id: perm
    site: 78
    derived_from: ~
    transform:
      op: rbind
  - id: obs_a
    site: 98
    derived_from:
      - obs
    transform:
      op: subset
      expr: obs[alpha_name == a]
  - id: null_a
    site: 99
    derived_from:
      - perm
    transform:
      op: subset
      expr: perm[alpha_name == a, q2_loocv]
  - id: fdr_dt
    site: 115
    derived_from: ~
    transform:
      op: rbind
  - id: best
    site: 118
    derived_from:
      - fdr_dt
    transform:
      op: subset
      expr: fdr_dt[, .SD[which.min(q_bh)], by = gene]
  - id: bed
    site: 122
    origin: '{opt.bed}'
    origin_kind: file
    transform:
      op: read
      fn: fread
  - id: gene_pos
    site: 129
    derived_from:
      - bed
    transform:
      op: subset
      expr: bed[, .(chr = first(chr), pos = first(mid)), by = gene]
  - id: gene_pos
    site: 131
    derived_from:
      - gene_pos
    transform:
      op: subset
      expr: gene_pos[chr %in% chrom_levels]
  - id: chrom_size
    site: 133
    derived_from:
      - gene_pos
    transform:
      op: subset
      expr: gene_pos[, .(max_pos = max(pos)), by = chr]
  - id: gene_pos
    site: 135
    derived_from:
      - gene_pos
      - chrom_size
    transform:
      op: merge
      by:
        - chr
  - id: fdr_dt
    site: 137
    derived_from:
      - fdr_dt
      - gene_pos
    transform:
      op: merge
      by:
        - gene
  - id: best
    site: 138
    derived_from:
      - best
      - gene_pos
    transform:
      op: merge
      by:
        - gene
  - id: chrom_centers
    site: 141
    derived_from:
      - gene_pos
    transform:
      op: subset
      expr: gene_pos[, .(center = (min(x_cum) + max(x_cum))/2), by = chr]
  - id: qq_dt
    site: 201
    derived_from:
      - fdr_dt
    transform:
      op: subset
      expr: fdr_dt[!is.na(p_emp)]
  - id: lambda_gc
    site: 206
    derived_from:
      - qq_dt
    transform:
      op: subset
      expr: qq_dt[, .(lambda_gc = median(qchisq(1 - p_emp, df = 1), na.rm = TRUE)/qchisq(0.5,
        1)), by = alpha_name]
  - id: apm_sub
    site: 282
    derived_from:
      - best
    transform:
      op: subset
      expr: best[gene %in% apm_genes & !is.na(x_cum)]
  - id: m6_sub
    site: 283
    derived_from:
      - best
    transform:
      op: subset
      expr: best[gene %in% m6_stable & !is.na(x_cum)]
