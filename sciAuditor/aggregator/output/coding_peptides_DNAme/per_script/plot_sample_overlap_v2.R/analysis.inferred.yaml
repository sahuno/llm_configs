  - id: available_df
    site: 66
    derived_from:
      - all_df
    transform:
      op: pipe
      expr: all_df %>% select(patient_id, modality, sample_type) %>% distinct() %>%
        mutate(available = 1)
  - id: grid_df
    site: 71
    derived_from:
      - available_df
    transform:
      op: pipe
      expr: grid_df %>% left_join(available_df, by = c("patient_id", "modality", "sample_type"))
        %>% mutate(available = replace_na(available, 0), Status = factor(ifelse(available
        == 1, "Available", "Missing"), l...
  - id: patient_completeness
    site: 85
    derived_from:
      - grid_df
    transform:
      op: pipe
      expr: grid_df %>% group_by(patient_id) %>% summarise(n_available = sum(available),
        .groups = "drop") %>% arrange(desc(n_available), patient_id)
  - id: tumor_3way
    site: 93
    derived_from:
      - grid_df
    transform:
      op: pipe
      expr: grid_df %>% filter(sample_type == "Tumor", available == 1) %>% group_by(patient_id)
        %>% summarise(n_tumor_modalities = n_distinct(modality), .groups = "drop")
        %>% filter(n_tumor_modalities == 3) %>% ...
