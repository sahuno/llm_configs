dataframes:
  - id: merged
    site: 66
    origin: '{opt.q9_merged}'
    origin_kind: file
    transform:
      op: read
      fn: fread
  - id: meth_set
    site: 88
    derived_from:
      - merged
    transform:
      op: subset
      expr: merged[!is.na(mean_apm_5mC) & !is.na(impact_tmb)]
  - id: sub
    site: 102
    derived_from:
      - meth_set
    transform:
      op: subset
      expr: meth_set[tmb_tertile == tt & !is.na(get(pred)) & !is.na(os.month) & !is.na(os.event)
        & os.month > 0]
  - id: strat_res
    site: 123
    derived_from: ~
    transform:
      op: rbind
  - id: sub
    site: 131
    derived_from:
      - meth_set
    transform:
      op: subset
      expr: meth_set[!is.na(get(pred)) & !is.na(impact_tmb) & !is.na(os.month) & !is.na(os.event)
        & os.month > 0]
  - id: int_res
    site: 149
    derived_from: ~
    transform:
      op: rbind
  - id: msi_desc
    site: 155
    derived_from:
      - merged
    transform:
      op: subset
      expr: merged[!is.na(mean_apm_5mC), .(n = .N, median_apm = median(mean_apm_5mC,
        na.rm = TRUE), median_nlrc5 = median(nlrc5_pct_5mC, na.rm = TRUE), n_os_events
        = sum(os.event > 0, na.rm = TRUE), median_os_mo...
  - id: mss_h_sub
    site: 166
    derived_from:
      - merged
    transform:
      op: subset
      expr: merged[impact_msi %in% c("Stable", "Instable") & !is.na(nlrc5_pct_5mC)
        & !is.na(os.month) & !is.na(os.event) & os.month > 0]
  - id: pep_set
    site: 182
    derived_from:
      - merged
    transform:
      op: subset
      expr: merged[!is.na(mean_apm_5mC) & !is.na(impact_tmb) & !is.na(shannon_H)]
  - id: fp
    site: 197
    derived_from:
      - strat_res
    transform:
      op: subset
      expr: strat_res[!is.na(HR) & is.finite(HR)]
