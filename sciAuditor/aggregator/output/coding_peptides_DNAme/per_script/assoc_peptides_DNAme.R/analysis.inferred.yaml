schema_version: '0.2'
analysis_unit:
  id: assoc_peptides_DNAme
  kind: pair
pair_unit:
  launcher:
    path: /data1/greenbab/projects/janjigian_su2c_WGS-ONT_sam/DNAme_prod/scripts/coding_peptides_DNAme/scripts/submit_assoc_peptides_DNAme.sh
