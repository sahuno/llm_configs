dataframes:
  - id: bed
    site: 73
    origin: '{BED_PATH}'
    origin_kind: file
    transform:
      op: read
      fn: fread
  - id: dt
    site: 96
    origin: '{f}'
    origin_kind: file
    transform:
      op: read
      fn: fread
  - id: agg
    site: 104
    derived_from: ~
    transform:
      op: rbind
  - id: agg
    site: 110
    derived_from:
      - agg
      - bed
    transform:
      op: merge
      by:
        - promoter_id
  - id: tpm_raw
    site: 127
    origin: '{TPM_PATH}'
    origin_kind: file
    transform:
      op: read
      fn: fread
  - id: tpm_sym
    site: 132
    derived_from:
      - tpm_raw
    transform:
      op: subset
      expr: tpm_raw[, lapply(.SD, function(x) sum(as.numeric(x), na.rm = TRUE)), by
        = gene_symbol, .SDcols = tpm_cols]
  - id: df
    site: 142
    derived_from:
      - agg
    transform:
      op: merge
      by:
        - gene_symbol
        - patient_id
  - id: df
    site: 149
    derived_from:
      - df
    transform:
      op: subset
      expr: df[!is.na(weighted_mean_pct) & !is.na(log2_tpm)]
  - id: per_sample
    site: 160
    derived_from:
      - df
    transform:
      op: subset
      expr: df[, { if (.N >= 10 && var(weighted_mean_pct) > 0 && var(log2_tpm) > 0)
        { ct <- suppressWarnings(cor.test(weighted_mean_pct, log2_tpm, method = "spearman",
        exact = FALSE)) .(n = .N, rho = unname(ct$e...
  - id: d
    site: 184
    derived_from:
      - df
    transform:
      op: subset
      expr: df[patient_id == pt]
  - id: st
    site: 185
    derived_from:
      - per_sample
    transform:
      op: subset
      expr: per_sample[patient_id == pt]
  - id: df_plot
    site: 232
    derived_from:
      - df
      - per_sample
    transform:
      op: merge
      by:
        - patient_id
  - id: facet_levels
    site: 237
    derived_from:
      - per_sample
    transform:
      op: subset
      expr: per_sample[order(rho), patient_id]
