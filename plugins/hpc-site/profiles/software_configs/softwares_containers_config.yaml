LOCAL_SOFTWARE_PATH_PERSONAL: "/data1/greenbab/users/ahunos/apps/containers/"
LOCAL_SOFTWARE_PATH_GROUP: "/data1/greenbab/software/images"
DOCKERHUB_USERNAME: "sahuno"
DOCKERHUB_personal_repo: https://hub.docker.com/repositories/sahuno
GITHUB_USERNAME: "sahuno"
ONT_software_container_container_name: "sahuno/onttools"
DOCKER_HUB_CONTAINERS:
  - name: "Onttools v3.9; samtools, dorado, bedtools"
    value: "sahuno/onttools:v3.9"
  - name: "Onttools Latest; samtools, dorado, bedtools"
    value: "sahuno/onttools:latest"
  - name: "Modkit Latest"
    value: "sahuno/modkit:latest"
  - name: "Bedtools Latest"
    value: "sahuno/bedtools:latest"
  - name: "Bedtools Suite v2.31.1"
    value: "sahuno/bedtools_suite:v2.31.1"
  - name: "UCSC Utils Latest"
    value: "sahuno/ucsc_utils:latest"
  - name: "Mosdepth Multiarch and multiqc"
    value: "sahuno/mosdepth:multiarch"
  - name: "Sniffles 2.6.2"
    value: "sahuno/sniffles:2.6.2"
  - name: "Numpyroml Latest"
    value: "sahuno/numpyroml:latest"

LOCAL_CONTAINERS:
  - name: "samtools v1.23.1; samtools + bcftools + htslib (1.23.1)"
    path: "/data1/greenbab/users/ahunos/apps/containers/samtools_v1.23.1.sif"
    def:  "/data1/greenbab/users/ahunos/apps/containers/samtools.def"
    source: "https://github.com/samtools/samtools/releases/tag/1.23.1"
  - name: "minimap2 v2.30; built from source, includes paftools.js + k8"
    path: "/data1/greenbab/users/ahunos/apps/containers/minimap2_v2.30.sif"
    def:  "/data1/greenbab/users/ahunos/apps/installedSoftwares/installminimap2/minimap2.def"
    source: "https://github.com/lh3/minimap2/releases/tag/v2.30"
  - name: "modkit v0.6.2; bioconda ont-modkit (binary --version reports 0.6.1 — upstream Cargo.toml not bumped)"
    path: "/data1/greenbab/software/images/def_files/modkit_v0.6.2.sif"
    def:  "/data1/greenbab/software/images/def_files/modkit_v0.6.2.def"
    source: "https://github.com/nanoporetech/modkit/releases/tag/v0.6.2"
    symlinks:
      - "/data1/greenbab/software/images/modkit_latest.sif"           # group-shared 'latest' alias
      - "/data1/greenbab/users/ahunos/apps/containers/modkit_latest.sif"  # personal 'latest' alias
  - name: "igv-reports v1.16.0; self-contained HTML genomic-region reports (create_report)"
    path: "/data1/greenbab/users/ahunos/apps/containers/igv-reports_1.16.0.sif"
    source: "https://depot.galaxyproject.org/singularity/igv-reports:1.16.0--pyh7e72e81_0"
    notes: "Pull command: wget -O <path> '<source>'. Always invoke with `singularity exec --cleanenv` — host SSL_CERT_FILE on RHEL 8 leaks into SIF and crashes create_report's standalone ideogram fetch (see `singularity-build` skill → references/env_leak.md). The igv-reports skill driver handles --cleanenv automatically when --apptainer is passed."
    used_by_skill: "igv-reports"
