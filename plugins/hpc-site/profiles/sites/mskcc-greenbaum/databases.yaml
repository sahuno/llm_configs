## list of frequently accessed databases for fast look up
############################################################
#
# VERSION PINNING
#
# Every entry below points at a resource that has releases: GENCODE annotations,
# RepeatMasker libraries, CpG island sets, assembly patches. A path alone does
# not pin anything — a symlink can move and a file can be regenerated in place
# under the same name, and no analysis reading this registry would notice. That
# is a silent failure of the same family as the ones in `analysis-gotchas`:
# numbers move between reruns of unchanged code, with nothing in any log.
#
# So each build carries:
#   version:   the release actually in use. Derived from the filenames below;
#              state it explicitly so a methods section can cite it.
#   checksum:  sha256 of the primary fasta. NOT YET POPULATED — must be computed
#              on the cluster, where the files are:
#                  sha256sum <fasta> | cut -d" " -f1
#              Until filled, this registry records WHICH release is meant but
#              cannot detect a file changing under a fixed name.
#
# The `pinned-reference-snapshot` Claude Science skill (mirrored at
# science-skills/pinned-reference-snapshot/) implements exactly this pattern and
# ships sha256_file, write_pin_manifest and verify_pin. Reuse those rather than
# writing new ones, and follow its change-ledger step whenever a pin moves:
# re-derive the affected results and record what moved.
#
############################################################

#iris:
reference_genomes:
        local:
            mm10:
                    version: "GENCODE vM25 / RepeatMasker rmsk405 (RepLibrary 20140131)"
                    checksum: ""   # sha256 of fasta — compute on cluster, see header
