# Site template — copy to <your-site>.yaml and fill in.
#
# The live MSKCC/Greenbaum values are in ../profiles/. This file documents the
# shape those files expect so another site can be stood up without reverse-
# engineering them.
#
# Point Claude at your filled-in copy by exporting SITE_CONFIG to the profiles
# directory you want used:
#
#   export SITE_CONFIG="$HOME/projects/llm_configs/plugins/hpc-site/profiles"
#
# CLAUDE.md refers to everything below as $SITE_CONFIG/<file>.

site:
  name: example-cluster
  scheduler: slurm          # slurm | sge | none
  container_runtime: apptainer   # apptainer | singularity | docker | none

# --- $SITE_CONFIG/databases/databases_config.yaml -------------------------
# Every genome build you support. `fasta` and `sizes` are the minimum; add
# gtf / CpGIslands / repMasker entries as your analyses need them.
#
# Rule enforced by the bio-guardrails plugin: never hardcode these paths in a
# script. Read them from this file at runtime.
reference_genomes:
  local:
    hg38:
      fasta:  /path/to/reference/hg38/genome.fa
      gtf:    /path/to/reference/hg38/annotation.gtf.gz
      sizes:  /path/to/reference/hg38/hg38.chrom.sizes
      CpGIslands: /path/to/reference/hg38/cpg_islands.bed
    mm10:
      fasta:  /path/to/reference/mm10/genome.fa
      sizes:  /path/to/reference/mm10/mm10.chrom.sizes
  # Optional S3 fallbacks for when local disk is unavailable.
  s3:
    hg38:
      fasta: s3://your-bucket/hg38/genome.fa

# --- $SITE_CONFIG/software_configs/softwares_containers_config.yaml --------
# Container images, keyed by tool. Prefer a local SIF path when you have one;
# fall back to a pullable URI.
containers:
  samtools:
    sif:   /path/to/images/samtools_1.21.sif
    uri:   docker://quay.io/biocontainers/samtools:1.21--h50ea8bc_0
  # notes: field is free text — record pull commands and runtime flags here.

# --- $SITE_CONFIG/workflow_profiles/executor_config.yaml ------------------
# Scheduler defaults. Get the partition names from your own cluster; a wrong
# default here fails every job with "Invalid account or account/partition
# combination specified".
executor:
  default_partition: short
  gpu_partition: gpu
  account: your-account
  max_jobs: 100
  # Nodes to exclude from benchmarking, if your partition is heterogeneous.
  exclude_nodes: []

# --- Notes for adapting ---------------------------------------------------
# The `mskcc-hpc` skill in this plugin records what was measured on the
# reference cluster and, at the end, lists what is worth measuring on a new
# one (partition access, benchmark tooling, storage topology, node
# heterogeneity). Read it as a checklist, not as facts about your site.
