name: guardrails

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hooks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The hooks parse tool input with jq when present and python3 otherwise.
        # Both paths must behave identically — a guardrail that silently stops
        # guarding on a machine without jq is worse than no guardrail.
        json_backend: [jq, python3-only]
    name: hooks (${{ matrix.json_backend }})
    steps:
      - uses: actions/checkout@v4

      - name: Remove jq to exercise the python3 fallback
        if: matrix.json_backend == 'python3-only'
        run: sudo rm -f "$(command -v jq)"

      - name: Confirm which backend is under test
        run: |
          command -v jq >/dev/null && echo "jq: present" || echo "jq: absent"
          command -v python3 >/dev/null && echo "python3: present" || echo "python3: absent"

      - name: Run hook test suite
        run: ./plugins/bio-guardrails/tests/test_hooks.sh

  profiles:
    runs-on: ubuntu-latest
    name: profile resolution
    steps:
      - uses: actions/checkout@v4
      - name: Install pyyaml for paths.yaml key lookup
        run: pip install --quiet pyyaml
      - name: Run profile resolver tests
        # $USER is unset on the runner; the suite exercises the $USER fallback,
        # so give it a value that matches a real user profile.
        run: USER=sahuno ./plugins/hpc-site/profiles/test_resolve.sh

  site-paths:
    runs-on: ubuntu-latest
    name: site-path triage
    steps:
      - uses: actions/checkout@v4
      - name: Every site path is classified, and executables are converted
        # Fails on an unreviewed occurrence or an EXECUTABLE one still holding
        # a literal. EVIDENCE entries (citations backing dated claims) pass by
        # design — rewriting those would destroy the record.
        run: ./tools/audit_site_paths.sh

  scaffolder:
    runs-on: ubuntu-latest
    name: project scaffolder
    steps:
      - uses: actions/checkout@v4
      - name: Scaffolded projects carry a project-level CLAUDE.md
        run: python3 plugins/bio-skills/scripts/test_init_project.py

  verify-run:
    runs-on: ubuntu-latest
    name: run verification
    steps:
      - uses: actions/checkout@v4
      - name: A run that exits 0 but dropped work must still FAIL
        run: python3 plugins/bio-skills/scripts/test_verify_run.py

  gotchas:
    runs-on: ubuntu-latest
    name: gotcha records
    steps:
      - uses: actions/checkout@v4
      - name: Every incident record carries version, date, status and a detector
        run: python3 tools/gotcha_audit.py

  figure-manifest:
    runs-on: ubuntu-latest
    name: figure manifest
    steps:
      - uses: actions/checkout@v4
      - name: Figures can be traced to the code that produced them
        run: python3 plugins/bio-skills/scripts/test_figure_manifest.py

  science-skills:
    runs-on: ubuntu-latest
    name: science skills
    steps:
      - uses: actions/checkout@v4
      - name: SKILL.md casing and frontmatter
        run: |
          fail=0
          for d in science-skills/*/; do
            n=$(basename "$d")
            [ -f "$d/SKILL.md" ] || { echo "::error::$n has no SKILL.md"; fail=1; continue; }
            fm=$(awk 'NR==1&&/^---$/{f=1;next} f&&/^---$/{exit} f&&/^name:/{sub(/^name: */,"");print;exit}' "$d/SKILL.md")
            [ "$fm" = "$n" ] || { echo "::error::$n frontmatter name is '$fm'"; fail=1; }
            grep -q '^description:' "$d/SKILL.md" || { echo "::error::$n has no description"; fail=1; }
          done
          # App metadata must never be committed: .sync-org carries the org UUID.
          if find science-skills -name '.sync-org' -o -name '.catalog_stamp' | grep -q .; then
            echo "::error::app metadata committed under science-skills/"; fail=1
          fi
          [ $fail -eq 0 ] && echo "all science skills valid"
          exit $fail

  manifests:
    runs-on: ubuntu-latest
    name: plugin manifests
    steps:
      - uses: actions/checkout@v4
      - name: Validate marketplace and plugin manifests as JSON
        run: |
          for f in .claude-plugin/marketplace.json \
                   plugins/*/.claude-plugin/plugin.json \
                   plugins/bio-guardrails/hooks/hooks.json; do
            python3 -c "import json,sys; json.load(open('$f'))" && echo "ok   $f"
          done

  skill-filenames:
    runs-on: ubuntu-latest
    name: SKILL.md casing
    steps:
      - uses: actions/checkout@v4
      - name: Reject lowercase skill.md
        # Case-insensitive macOS hides this; on Linux a lowercase skill.md
        # simply does not load. Three skills shipped broken this way.
        run: |
          if bad=$(git ls-files 'plugins/*/skills/*' | grep -E '/skill\.md$'); then
            echo "::error::lowercase skill.md will not load on Linux:"; echo "$bad"; exit 1
          fi
          echo "all SKILL.md correctly cased"

  figure-composer:
    runs-on: ubuntu-latest
    name: lab-figure-composer fork
    steps:
      - uses: actions/checkout@v4
      - name: Install the plotting stack the kernel tiles output from
        run: pip install --quiet matplotlib numpy pillow pypdf
      - name: Every divergence from the vendor figure-composer still holds
        # This skill is a FORK of a vendor Claude Science skill that is rewritten
        # by every release. The suite pins each deliberate difference — house call
        # order in the panel prompt, strict slot sizing, house-face panel letters,
        # exact column edges, vector export — so drift after an upstream bump is
        # visible here rather than in a figure.
        run: python3 science-skills/lab-figure-composer/test_kernel.py
